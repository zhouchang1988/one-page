<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>御剑飞行 · 月出云海</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #08131f; }
  body { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", "Songti SC", serif; }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background:
      linear-gradient(180deg, rgba(6,12,20,.32) 0%, transparent 16%, transparent 80%, rgba(6,12,20,.4) 100%),
      radial-gradient(ellipse at center, transparent 58%, rgba(4,9,15,.42) 100%); }
  .panel { position: fixed; z-index: 5; pointer-events: none; color: #ece3cb; text-shadow: 0 1px 8px rgba(0,0,0,.6); }

  /* 左上题字：竖排标题 + 落款小字 + 朱文印章 */
  #titleBox { top: 34px; left: 40px; display: flex; align-items: flex-start; gap: 18px; animation: fadeDown 1.6s .3s both; }
  #titleBox h1 { writing-mode: vertical-rl; font-size: 46px; letter-spacing: 16px; font-weight: 600; color: #f7efdb; }
  #titleBox .subCol { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #titleBox .sub { writing-mode: vertical-rl; margin-top: 8px; font-size: 15px; letter-spacing: 7px; color: #c9d6cd; opacity: .85; }
  #seal { writing-mode: vertical-rl; padding: 7px 4px; background: linear-gradient(160deg, #b0402f, #8e2f24); color: #fdf3e2;
    font-size: 15px; letter-spacing: 3px; line-height: 1.3; border-radius: 4px; transform: rotate(-4deg);
    box-shadow: 0 2px 10px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(253,243,226,.35); }

  /* 右上疏朗的行书小注 */
  #stats { top: 38px; right: 40px; display: flex; flex-direction: column; gap: 10px; text-align: right;
    font-size: 14px; letter-spacing: 3px; animation: fadeDown 1.6s .5s both; }
  #stats .row { display: flex; justify-content: flex-end; align-items: baseline; gap: 14px; }
  #stats .k { opacity: .58; font-size: 12px; letter-spacing: 4px; }
  #stats b { color: #f4d9a0; font-weight: 600; min-width: 96px; text-align: left; }

  /* 右下 Ghost 按钮 */
  #btns { position: fixed; z-index: 6; right: 40px; bottom: 36px; display: flex; flex-direction: column; gap: 10px; animation: fadeIn 1.6s .7s both; }
  #btns button { pointer-events: auto; cursor: pointer; font-family: inherit; font-size: 14px; letter-spacing: 4px; text-indent: 4px;
    padding: 10px 22px; color: #e9dfc2; background: rgba(10,20,30,.42); border: 1px solid rgba(233,220,180,.28);
    border-radius: 999px; backdrop-filter: blur(8px); transition: .25s; }
  #btns button:hover { border-color: rgba(244,217,160,.75); color: #fff3d4; background: rgba(30,44,56,.5);
    box-shadow: 0 0 18px rgba(244,217,160,.12); }

  /* 底部操作提示，数秒后隐去 */
  #hint { left: 50%; bottom: 36px; transform: translateX(-50%); font-size: 13px; letter-spacing: 3px; color: #d8cfb4;
    background: rgba(8,16,24,.4); border: 1px solid rgba(233,220,180,.2); border-radius: 999px; padding: 9px 24px;
    white-space: nowrap; backdrop-filter: blur(8px); transition: opacity 1.6s; animation: fadeUpC 1.6s .9s both; }
  #hint.hide { opacity: 0; }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUpC { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (max-width: 720px) {
    #titleBox { top: 22px; left: 22px; gap: 12px; }
    #titleBox h1 { font-size: 32px; letter-spacing: 10px; }
    #titleBox .sub { font-size: 12px; letter-spacing: 5px; }
    #seal { font-size: 12px; }
    #stats { top: 24px; right: 22px; font-size: 12px; }
    #stats b { min-width: 76px; }
    #btns { right: 22px; bottom: 24px; }
    #btns button { font-size: 12px; padding: 8px 16px; }
    #hint { bottom: 24px; font-size: 11px; padding: 8px 14px; max-width: 88vw; white-space: normal; text-align: center; }
  }

  /* 加载与错误画面：一轮呼吸的月 */
  #loading, #error { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    background: radial-gradient(ellipse at 50% 66%, #122639 0%, #0a1725 55%, #060d16 100%);
    color: #e7dcc0; transition: opacity 1.1s; }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading .moon { width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #fff9e6, #f3ddab 70%, #e6c58e);
    box-shadow: 0 0 46px 14px rgba(246,222,164,.26), 0 0 120px 42px rgba(246,222,164,.1);
    animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.07); opacity: 1; } }
  #loading h1 { font-size: 38px; letter-spacing: 18px; text-indent: 18px; color: #f3ead2; font-weight: 600; }
  #loading .cap { font-size: 14px; letter-spacing: 6px; color: #bfae87; }
  #error[hidden] { display: none; }
  #error h1 { font-size: 26px; letter-spacing: 8px; color: #f3ead2; font-weight: 600; }
  #error p { letter-spacing: 2px; line-height: 2; text-align: center; color: #bfae87; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<div id="titleBox" class="panel">
  <h1>御剑飞行</h1>
  <div class="subCol">
    <div class="sub">乘风御剑 · 云游太虚</div>
    <div id="seal">逍遥</div>
  </div>
</div>

<div id="stats" class="panel">
  <div class="row"><span class="k">模式</span><b id="statMode">云游巡航</b></div>
  <div class="row"><span class="k">剑速</span><b id="statSpeed">0 里</b></div>
  <div class="row"><span class="k">高度</span><b id="statAlt">0 丈</b></div>
</div>

<div id="btns">
  <button id="btnMode">手动御剑</button>
  <button id="btnReset">回到起点</button>
</div>

<div id="hint" class="panel">W/S 俯仰 · A/D 转向 · Space 御风加速 · 滚轮调速 · C 巡航 · R 复位</div>

<div id="loading">
  <div class="moon"></div>
  <h1>御剑飞行</h1>
  <div class="cap">月升沧海 · 画卷徐展</div>
</div>

<div id="error" hidden>
  <h1>画卷未能展开</h1>
  <p>页面需从 CDN 加载 Three.js，请检查网络连接后刷新重试。</p>
</div>

<script type="module">
let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
} catch (e) {
  document.getElementById('loading').classList.add('hide');
  document.getElementById('error').hidden = false;
  throw e;
}

/* ---------------- 基础工具 ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wrapAngle = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8fa9b8, 320, 2700);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 9000);
camera.position.set(80, 260, 720);

/* ---------------- 月夜光照 ---------------- */
const MOON_POS = new THREE.Vector3(-1550, 950, -2950);

scene.add(new THREE.HemisphereLight(0x9fbcc9, 0x1c2e33, 0.75));
scene.add(new THREE.AmbientLight(0x536e7c, 0.4));
const moonLight = new THREE.DirectionalLight(0xd8ecf6, 1.35);
moonLight.position.copy(MOON_POS);
scene.add(moonLight);

/* ---------------- 天空 · 星 · 月 ---------------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(4200, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      cTop: { value: new THREE.Color(0x0b1d31) },
      cHor: { value: new THREE.Color(0x5b7e93) },
      cBot: { value: new THREE.Color(0x1a2c38) },
      cWarm: { value: new THREE.Color(0xc99a5e) },
      moonDir: { value: MOON_POS.clone().normalize() },
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec3 vP; uniform vec3 cTop, cHor, cBot, cWarm; uniform vec3 moonDir;
      void main(){
        vec3 d = normalize(vP);
        float h = d.y;
        vec3 c = h > 0.0 ? mix(cHor, cTop, pow(smoothstep(0.0, 0.5, h), 0.7))
                         : mix(cHor, cBot, smoothstep(0.0, -0.3, h));
        float m = max(dot(d, moonDir), 0.0);
        c += cWarm * pow(m, 6.0) * 0.38 * smoothstep(0.6, 0.0, abs(h - 0.18));
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
scene.add(sky);

/* ---------------- 程序化贴图 ---------------- */
function makeCanvas(s, draw) {
  const c = document.createElement('canvas'); c.width = c.height = s;
  draw(c.getContext('2d'), s);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = makeCanvas(128, (x, s) => {
  const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, s, s);
});
const cloudTex = makeCanvas(256, (x, s) => {
  for (let i = 0; i < 26; i++) {
    const px = rand(s*0.2, s*0.8), py = rand(s*0.35, s*0.65), r = rand(s*0.08, s*0.22);
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
});
const seaTex = makeCanvas(512, (x, s) => {
  x.fillStyle = 'rgba(255,255,255,.22)'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 90; i++) {
    const px = rand(0, s), py = rand(0, s), r = rand(20, 70);
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
});
seaTex.wrapS = seaTex.wrapT = THREE.RepeatWrapping;
const seaTex2 = seaTex.clone(); seaTex2.needsUpdate = true;
// 月轮：清辉 + 隐约的月海
const moonTex = makeCanvas(256, (x, s) => {
  const c = s / 2, r = s * 0.4;
  const g = x.createRadialGradient(c, c, 0, c, c, r * 1.18);
  g.addColorStop(0, 'rgba(255,250,230,1)'); g.addColorStop(0.8, 'rgba(255,246,214,1)');
  g.addColorStop(0.92, 'rgba(255,240,200,.9)'); g.addColorStop(1, 'rgba(255,240,200,0)');
  x.fillStyle = g; x.beginPath(); x.arc(c, c, r * 1.18, 0, 7); x.fill();
  x.save(); x.beginPath(); x.arc(c, c, r * 0.98, 0, 7); x.clip();
  for (let i = 0; i < 6; i++) {
    const bx = c + rand(-r*0.5, r*0.5), by = c + rand(-r*0.5, r*0.5), br = rand(r*0.14, r*0.3);
    const bg = x.createRadialGradient(bx, by, 0, bx, by, br);
    bg.addColorStop(0, 'rgba(198,188,166,.28)'); bg.addColorStop(1, 'rgba(198,188,166,0)');
    x.fillStyle = bg; x.beginPath(); x.arc(bx, by, br, 0, 7); x.fill();
  }
  x.restore();
});

// 月与月晕
function addSprite(map, color, opacity, scale, pos, fog = false) {
  const m = new THREE.SpriteMaterial({ map, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, fog });
  const sp = new THREE.Sprite(m); sp.scale.set(scale, scale, 1); sp.position.copy(pos); scene.add(sp);
  return sp;
}
addSprite(glowTex, 0xf2cf9a, 0.11, 2200, MOON_POS);
addSprite(glowTex, 0xf7dcaa, 0.38, 1000, MOON_POS);
addSprite(moonTex, 0xffffff, 1, 560, MOON_POS);

// 星子两层，亮层缓缓明灭
function makeStars(n, size, opacity) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, y = rand(0.1, 1);
    const rxz = Math.sqrt(1 - y * y) * 3900;
    pos[i*3] = Math.cos(a) * rxz; pos[i*3+1] = y * 3900; pos[i*3+2] = Math.sin(a) * rxz;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: 0xdceaf2, size, sizeAttenuation: false, transparent: true,
    opacity, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  scene.add(new THREE.Points(g, m));
  return m;
}
makeStars(650, 2.2, 0.7);
const brightStars = makeStars(110, 3.4, 0.8);

/* ---------------- 山：三叠远山，月被雾打湿 ---------------- */
function noise2(x, z, s) { return Math.sin(x*0.013+s) * Math.cos(z*0.011+s*1.7) + Math.sin((x+z)*0.006+s*2.3) * 0.6; }
function displace(geo, amp, seed, keepTop) {
  const p = geo.attributes.position, h = geo.parameters.height || 1;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const yn = clamp((y + h/2) / h, 0, 1);
    const a = amp * Math.pow(1 - yn, keepTop ? 1.6 : 1.0);
    p.setXYZ(i, x + noise2(x, z, seed) * a, y, z + noise2(z, x, seed + 9) * a);
  }
  geo.computeVertexNormals();
}
function paintByHeight(geo, cBase, cTop) {
  const p = geo.attributes.position, h = geo.parameters.height || 1, n = p.count;
  const colors = new Float32Array(n * 3);
  const cb = new THREE.Color(cBase), ct = new THREE.Color(cTop), c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const t = clamp((p.getY(i) + h/2) / h, 0, 1);
    c.copy(cb).lerp(ct, t * t * 0.9 + t * 0.1);
    const j = 1 + (Math.random() - 0.5) * 0.07;
    colors[i*3] = c.r * j; colors[i*3+1] = c.g * j; colors[i*3+2] = c.b * j;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
const mtnMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0 });
function makePeak(x, z, h, r, seed, cBase, cTop, yBase = -80) {
  const geo = new THREE.ConeGeometry(r, h, 7, 6);
  displace(geo, r * 0.22, seed);
  paintByHeight(geo, cBase, cTop);
  const m = new THREE.Mesh(geo, mtnMat);
  m.position.set(x, h / 2 + yBase, z);
  scene.add(m);
  return m;
}
function ridgeRing(count, dMin, dMax, hMin, hMax, cBase, cTop, seed0) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + rand(-0.14, 0.14);
    const d = rand(dMin, dMax), h = rand(hMin, hMax);
    makePeak(Math.cos(a) * d, Math.sin(a) * d, h, h * rand(0.55, 0.8), seed0 + i * 1.37, cBase, cTop);
  }
}
ridgeRing(26, 1900, 2500, 300, 720, 0x2c4c62, 0x8fb0bd, 11);   // 最远一叠，几乎化进雾里
ridgeRing(20, 1200, 1750, 260, 560, 0x203d50, 0x6b8ea0, 31);
ridgeRing(14, 650, 1050, 180, 420, 0x142c3c, 0x49697c, 57);    // 最近一叠，黛色最深

// 主仙峰：平顶，月照山巅，上有宝塔
{
  const g = new THREE.CylinderGeometry(48, 340, 640, 9, 6);
  displace(g, 55, 3.7, true);
  paintByHeight(g, 0x16303e, 0x7d9aa6);
  const m = new THREE.Mesh(g, mtnMat);
  m.position.set(0, 640 / 2 - 50, -620);
  scene.add(m);
}
// 云海中探头的丘峦
for (let i = 0; i < 12; i++) {
  const a = Math.random() * Math.PI * 2, d = rand(160, 640);
  const h = rand(40, 95), r = h * rand(0.9, 1.4);
  makePeak(Math.cos(a) * d, Math.sin(a) * d, h, r, 40 + i, 0x183430, 0x39584e, -20);
}
// 谷地
{
  const ground = new THREE.Mesh(new THREE.CircleGeometry(4200, 48), new THREE.MeshStandardMaterial({ color: 0x0f2028, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -52; scene.add(ground);
}

/* ---------------- 宝塔与松 ---------------- */
const goldMat = new THREE.MeshStandardMaterial({ color: 0xd9a84e, flatShading: true, roughness: 0.4, metalness: 0.6, emissive: 0x664411, emissiveIntensity: 0.5 });
const lanternGlows = [];
function makePagoda(levels, baseR, lit) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x5f4034, flatShading: true, roughness: 0.8 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x1e3238, flatShading: true, roughness: 0.7 });
  let y = 0, r = baseR;
  for (let l = 0; l < levels; l++) {
    const bh = r * 0.95;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.62, r * 0.7, bh, 8), bodyMat);
    body.position.y = y + bh / 2; g.add(body);
    if (lit && l % 2 === 0) { // 塔窗透出的一点暖光
      const gm = new THREE.SpriteMaterial({ map: glowTex, color: 0xffbe6a, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
      const gs = new THREE.Sprite(gm); gs.scale.set(r * 1.4, r * 1.4, 1); gs.position.set(0, y + bh / 2, r * 0.72); g.add(gs);
      lanternGlows.push(gm);
    }
    const roof = new THREE.Mesh(new THREE.ConeGeometry(r * 1.18, r * 0.5, 8), roofMat);
    roof.position.y = y + bh + r * 0.2; g.add(roof);
    y += bh + r * 0.28; r *= 0.86;
  }
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(baseR * 0.04, baseR * 0.04, baseR * 0.8, 6), goldMat);
  spire.position.y = y + baseR * 0.3; g.add(spire);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(baseR * 0.09, 8, 6), goldMat);
  orb.position.y = y + baseR * 0.72; g.add(orb);
  return g;
}
function makePine(h = 14) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(h*0.03, h*0.06, h*0.35, 5), new THREE.MeshStandardMaterial({ color: 0x3a2f26, flatShading: true }));
  trunk.position.y = h * 0.18; g.add(trunk);
  const lm = new THREE.MeshStandardMaterial({ color: 0x1d3c33, flatShading: true, roughness: 1 });
  for (let i = 0; i < 3; i++) {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(h * (0.34 - i * 0.07), h * 0.34, 6), lm);
    cone.position.y = h * (0.35 + i * 0.22); g.add(cone);
  }
  return g;
}
{ // 主峰顶的宝塔与松林
  const p = makePagoda(7, 15, true); p.position.set(0, 590, -620); scene.add(p);
  for (const [tx, tz, s] of [[26, -600, 1.2], [-30, -636, 1], [12, -656, 0.85], [-14, -592, 0.7]]) {
    const t = makePine(16 * s); t.position.set(tx, 590, tz); scene.add(t);
  }
}

/* ---------------- 浮空仙岛 ---------------- */
const islands = [];
function makeIsland(x, y, z, r, withPagoda) {
  const g = new THREE.Group();
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.92, r * 0.28, 8), new THREE.MeshStandardMaterial({ color: 0x2b4f42, flatShading: true, roughness: 1 }));
  grass.position.y = -r * 0.14; g.add(grass);
  const rockGeo = new THREE.ConeGeometry(r * 0.95, r * 1.7, 7, 4);
  displace(rockGeo, r * 0.18, x * 0.01 + z * 0.01);
  const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({ color: 0x3c4750, flatShading: true, roughness: 1 }));
  rock.rotation.x = Math.PI; rock.position.y = -r * 0.14 - r * 0.85; g.add(rock);
  const tn = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < tn; i++) {
    const t = makePine(rand(10, 18));
    t.position.set(rand(-r * 0.5, r * 0.5), 0, rand(-r * 0.5, r * 0.5));
    g.add(t);
  }

const TRAIL_N = 46;

const tCol = new Float32Array(TRAIL_N * 2 * 3);
{
  const idx = [];
  for (let i = 0; i < TRAIL_N - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  var tGeo = new THREE.BufferGeometry();
  tGeo.setIndex(idx);

const _tail = new THREE.Vector3(), _dir = new THREE.Vector3(), _side = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0), _lastSide = new THREE.Vector3(1, 0, 0);
const trailCol = new THREE.Color(0.16, 0.5, 0.78);

function resetTrail() { for (const p of trailPts) p.copy(S.pos); }
function updateTrail(boost) {
  player.localToWorld(_tail.set(0, 0.05, -2.4));
  for (let i = TRAIL_N - 1; i > 0; i--) trailPts[i].copy(trailPts[i - 1]);
  trailPts[0].copy(_tail);
  const wBase = boost ? 0.85 : 0.5;
  for (let i = 0; i < TRAIL_N; i++) {
    const p = trailPts[i];
    _dir.subVectors(trailPts[Math.max(i - 1, 0)], trailPts[Math.min(i + 1, TRAIL_N - 1)]);
    if (_dir.lengthSq() < 1e-8) _side.copy(_lastSide);
    else {
      _side.crossVectors(_dir, _up);
      if (_side.lengthSq() < 1e-6) _side.copy(_lastSide); else _side.normalize();
    }
    _lastSide.copy(_side);
    const k = i / (TRAIL_N - 1);
    const w = wBase * (1 - k) * (1 - k) + 0.02;
    const fade = Math.pow(1 - k, 1.8) * (boost ? 1.25 : 0.8);
    const o = i * 6;
    tPos[o]   = p.x + _side.x * w; tPos[o+1] = p.y + _side.y * w; tPos[o+2] = p.z + _side.z * w;
    tPos[o+3] = p.x - _side.x * w; tPos[o+4] = p.y - _side.y * w; tPos[o+5] = p.z - _side.z * w;
    tCol[o] = tCol[o+3] = trailCol.r * fade;
    tCol[o+1] = tCol[o+4] = trailCol.g * fade;
    tCol[o+2] = tCol[o+5] = trailCol.b * fade;
  }
  tGeo.attributes.position.needsUpdate = true;
  tGeo.attributes.color.needsUpdate = true;
}

const btnMode = document.getElementById('btnMode');
function setMode(m) {
  S.mode = m;

  if (m === 'cruise') { // 切入巡航：找到路线上最近的点，平滑接轨
    let best = 0, bd = Infinity;
    for (let i = 0; i < 400; i++) {
      const d = curve.getPointAt(i / 400).distanceToSquared(S.pos);
      if (d < bd) { bd = d; best = i / 400; }
    }
    S.cruiseT = best;
  }
}
function toggleMode() { setMode(S.mode === 'cruise' ? 'manual' : 'cruise'); }
btnMode.onclick = toggleMode;

function resetFlight() {
  S.pos.copy(cruisePts[0]);
  const t0 = curve.getTangentAt(0);
  S.yaw = Math.atan2(-t0.x, -t0.z);
  S.pitch = Math.asin(clamp(t0.y, -1, 1));
  S.roll = 0; S.cruiseT = 0;
  resetTrail();
}
document.getElementById('btnReset').onclick = resetFlight;

const statMode = document.getElementById('statMode');

/* ---------------- 飞行更新 ---------------- */
const tmpLook = new THREE.Vector3();
let snapCam = true;
function step(dt) {
  let yawIn = 0, pitchIn = 0;
  if (S.mode === 'manual') {
    yawIn = ((keys.KeyA || keys.ArrowLeft) ? 1 : 0) - ((keys.KeyD || keys.ArrowRight) ? 1 : 0);
    pitchIn = ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0);
    if (touch) { yawIn += touch.yaw; pitchIn += touch.pitch; }
    S.yaw += yawIn * 1.5 * dt;
    S.pitch = clamp(S.pitch + pitchIn * 1.1 * dt, -0.75, 0.75);
  } else {
    // 自动巡航：沿曲线取前瞻点，像 autopilot 一样打方向
    S.cruiseT = (S.cruiseT + S.speed * dt / curveLen) % 1;
    curve.getPointAt((S.cruiseT + (S.speed * 1.7) / curveLen + 0.012) % 1, tmpLook);
    const dir = tmpLook.sub(S.pos), dl = dir.length();
    if (dl > 0.001) {
      dir.divideScalar(dl);
      const dYaw = Math.atan2(-dir.x, -dir.z), dPitch = Math.asin(clamp(dir.y, -1, 1));
      S.yaw += clamp(wrapAngle(dYaw - S.yaw), -1.35 * dt, 1.35 * dt);
      S.pitch += clamp(dPitch - S.pitch, -0.9 * dt, 0.9 * dt);
      yawIn = clamp(wrapAngle(dYaw - S.yaw) * 2.5, -1, 1);
    }
  }
  S.yaw = wrapAngle(S.yaw);

  const boosting = S.mode === 'manual' && keys.Space;
  S.speed = lerp(S.speed, S.base * (boosting ? 1.85 : 1), 1 - Math.exp(-dt * 2.2));

  const cp = Math.cos(S.pitch);
  const fwd = new THREE.Vector3(-Math.sin(S.yaw) * cp, Math.sin(S.pitch), -Math.cos(S.yaw) * cp);
  S.pos.addScaledVector(fwd, S.speed * dt);
  if (S.pos.y < MIN_Y) { S.pos.y = MIN_Y; S.pitch = Math.max(S.pitch, 0.05); }
  if (S.pos.y > MAX_Y) { S.pos.y = MAX_Y; S.pitch = Math.min(S.pitch, -0.05); }

  S.roll = lerp(S.roll, yawIn * (S.mode === 'manual' ? 0.55 : 0.7), 1 - Math.exp(-dt * 5));
  player.position.copy(S.pos);
  player.quaternion.setFromEuler(new THREE.Euler(S.pitch, S.yaw, S.roll, 'YXZ'));
  player.updateMatrixWorld();

  // 相机跟随
  const dist = S.mode === 'cruise' ? 14 : 12.5;
  const desired = S.pos.clone().addScaledVector(fwd, -dist);
  desired.y += S.mode === 'cruise' ? 4.6 : 4.2;
  if (snapCam) { camera.position.copy(desired); snapCam = false; }
  else camera.position.lerp(desired, 1 - Math.exp(-dt * 3.2));
  camera.lookAt(S.pos.x + fwd.x * 10, S.pos.y + 1.6 + fwd.y * 10, S.pos.z + fwd.z * 10);
  camera.rotateZ(S.roll * 0.25);

  const fovT = boosting ? 74 : 62;
  if (Math.abs(camera.fov - fovT) > 0.05) {
    camera.fov = lerp(camera.fov, fovT, 1 - Math.exp(-dt * 4));
    camera.updateProjectionMatrix();
  }

  // 剑气随速度明暗
  const b = boosting ? 1 : 0;
  qi.scale.set(1 + b * 0.5, 1 + b * 0.9, 1);
  qiMat.opacity = 0.35 + b * 0.3;
  swordLight.intensity = 26 + b * 22;

  updateTrail(b);
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let firstFrame = true;
resetFlight();
setMode('cruise');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  step(dt);

  for (const it of islands) {
    it.g.position.y = it.baseY + Math.sin(t * 0.5 + it.ph) * 5;
    it.g.rotation.y += it.rs * dt;
  }
  for (const c of cranes) {
    const a = c.f.ph + c.off + t * c.f.sp;
    c.cr.position.set(c.f.c.x + Math.cos(a) * c.f.r, c.f.c.y + Math.sin(t * 0.8 + c.bob) * 12, c.f.c.z + Math.sin(a) * c.f.r);
    const sg = Math.sign(c.f.sp);
    c.cr.rotation.y = Math.atan2(-Math.sin(a) * sg, Math.cos(a) * sg);
    const flap = 0.15 + Math.sin(t * 6 + c.bob) * 0.5;
    c.cr.userData.wl.rotation.z = -flap; c.cr.userData.wr.rotation.z = flap;
  }
  const mp = mGeo.attributes.position.array;
  for (let i = 0; i < MOTES; i++) {
    mp[i*3+1] += mDat[i].rise * dt;
    mp[i*3] += Math.sin(t * 0.9 + mDat[i].ph) * mDat[i].sw * dt;
    mp[i*3+2] += Math.cos(t * 0.7 + mDat[i].ph) * mDat[i].sw * 0.6 * dt;
    if (mp[i*3+1] > 600 || Math.abs(mp[i*3] - S.pos.x) > 1100 || Math.abs(mp[i*3+2] - S.pos.z) > 1100) {
      mp[i*3] = S.pos.x + rand(-800, 800); mp[i*3+1] = rand(90, 320); mp[i*3+2] = S.pos.z + rand(-800, 800);
    }
  }
  mGeo.attributes.position.needsUpdate = true;

  seaTex.offset.x += dt * 0.004; seaTex.offset.y += dt * 0.0015;
  seaTex2.offset.x -= dt * 0.0025; seaTex2.offset.y += dt * 0.003;
  for (const c of clouds) { c.s.position.x += c.v * dt; if (c.s.position.x > 2600) c.s.position.x = -2600; }

  brightStars.opacity = 0.55 + 0.3 * Math.sin(t * 0.8);
  bladeGlowMat.opacity = 0.32 + 0.12 * Math.sin(t * 3) + (keys.Space && S.mode === 'manual' ? 0.2 : 0);
  for (let i = 0; i < lanternGlows.length; i++) lanternGlows[i].opacity = 0.42 + 0.14 * Math.sin(t * 2.2 + i * 1.7);
  fig.position.y = 0.05 + Math.sin(t * 2) * 0.03;

  const wind = 0.5 + S.speed / 60;
  for (const r of ribbons) {
    const p = r.m.geometry.attributes.position, arr = p.array, b = r.base;
    for (let i = 0; i < p.count; i++) {
      const t01 = -b[i*3+1] / r.len;
      arr[i*3] = b[i*3] + Math.sin(t * 4 + r.ph + t01 * 5) * 0.14 * t01 * wind;
      arr[i*3+2] = b[i*3+2] + Math.cos(t * 3.2 + r.ph + t01 * 4) * 0.12 * t01 * wind;
    }
    p.needsUpdate = true;
  }

  renderer.render(scene, camera);
  if (firstFrame) { firstFrame = false; document.getElementById('loading').classList.add('hide'); }

  statMode.textContent = S.mode === 'cruise' ? '云游巡航' : '手动御剑';
  statSpeed.textContent = Math.round(S.speed * 3.6) + ' 里';
  statAlt.textContent = Math.round(S.pos.y) + ' 丈';
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
